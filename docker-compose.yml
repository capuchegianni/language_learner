services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    container_name: korean_learner_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL:-file:./data/dev.db}
      - API_KEY=${API_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
    container_name: korean_learner_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
    depends_on:
      - backend

volumes:
  uploads_data:
